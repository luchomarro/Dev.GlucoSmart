name: glucosmart_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Google Sign-In — usado por google_sign_in_mobile.dart (Android/iOS)
  # En Web el export condicional usa google_sign_in_web.dart (dart:js/HtmlElementView)
  google_sign_in: ^7.2.0

  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  fl_chart: any
  intl: any
  http: ^1.2.2
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
